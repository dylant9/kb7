name: source checks

# Manual only, for now.
#
# This project is early and iterating fast, and the repo is private, so Actions
# minutes are billed. The previous config ran on every push AND every pull
# request — meaning a branch push fired it twice — and each run spent several
# minutes on `apt-get update` plus a full gcc-arm-none-eabi install before any
# checking happened.
#
# The checks themselves are still worth running; just run them locally:
#
#     make check
#
# Trigger a cloud run by hand from the Actions tab (Run workflow) when it is
# actually useful — before a release, or when validating something that depends
# on a clean-room environment rather than a local one.
#
# When the project stabilises, consider restoring automation narrowly, e.g.:
#   on:
#     pull_request:
#       branches: [main]
#       paths: ['replacement_fw/**', 'tools/**', 'Makefile']
# plus caching the APT toolchain so the install cost is paid once.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Full source, firmware, studio, and safety checks
        run: make check
