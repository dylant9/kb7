name: source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Full source, firmware, studio, and safety checks
        run: make check
